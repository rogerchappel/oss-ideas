name: Docs

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-hygiene:
    name: Docs hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate docs directory
        run: |
          set -euo pipefail

          test -d docs
          test -s docs/PRD.md

      - name: Validate markdown paths
        run: |
          set -euo pipefail

          find . -type f -name '*.md' -not -path './.git/*' -print | sort > markdown-files.txt
          test -s markdown-files.txt

          while IFS= read -r file; do
            test -s "$file"
          done < markdown-files.txt

      - name: Validate relative markdown links
        run: |
          set -euo pipefail

          find . -type f -name '*.md' -not -path './.git/*' -not -path './templates/*' -print0 |
            xargs -0 perl -ne '
              next if /`/;
              while (/\[[^\]]+\]\(([^):#][^)]*)\)/g) {
                my $target = $1;
                $target =~ s/[?#].*//;
                next if $target eq "" || $target =~ /^mailto:/ || $target =~ /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//;
                print "$ARGV:$.:$target\n";
              }
            ' > markdown-relative-links.txt

          while IFS=: read -r file _line target; do
            dir=$(dirname "$file")
            path="$dir/$target"
            case "$target" in
              /*) path=".$target" ;;
            esac

            test -e "$path" || {
              echo "Broken markdown link in $file: $target"
              exit 1
            }
          done < markdown-relative-links.txt
